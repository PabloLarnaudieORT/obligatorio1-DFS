$kind: http-request
name: /categoriasMusculosPorId
url: "{{productionURL}}/v1/categoriasMusculos/{{idCategoriaMusculo}}"
method: GET
body:
  type: text
  content: "{\r

    \    \"nombre\": \"Biceps\",\r

    \    \"descripcion\": \"N/A\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{token1}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("La respuesta es JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("Obtiene categoría muscular por id", function () {
          const json = pm.response.json();
          const idCategoriaMusculo = pm.collectionVariables.get("idCategoriaMusculo");

          pm.expect(json).to.have.property("message");
          pm.expect(json.message).to.include("Categoria muscular");
          pm.expect(json.message).to.include("obtenida con exito");

          pm.expect(json).to.have.property("categoriaMuscular");
          pm.expect(json.categoriaMuscular).to.have.property("_id", idCategoriaMusculo);
          pm.expect(json.categoriaMuscular).to.have.property("nombre");
          pm.expect(json.categoriaMuscular).to.have.property("idUsuario");
      });
    language: text/javascript
order: 3000
