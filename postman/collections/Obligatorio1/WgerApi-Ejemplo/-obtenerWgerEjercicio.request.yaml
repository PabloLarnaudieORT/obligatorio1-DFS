$kind: http-request
name: /obtenerWgerEjercicio
url: "{{productionURL}}/v1/wger-api/ejercicios"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token1}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("La respuesta es JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("Obtiene lista de ejercicios desde Wger", function () {
          const json = pm.response.json();

          pm.expect(json).to.have.property("message", "Ejercicios obtenidos desde Wger");
          pm.expect(json).to.have.property("total").that.is.a("number");
          pm.expect(json).to.have.property("ejercicios").that.is.an("array");
      });

      pm.test("Lista contiene al menos un ejercicio", function () {
          const json = pm.response.json();

          pm.expect(json.ejercicios.length).to.be.above(0);
      });
    language: text/javascript
order: 2000
