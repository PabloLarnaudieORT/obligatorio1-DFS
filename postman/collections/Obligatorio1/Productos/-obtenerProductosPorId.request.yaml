$kind: http-request
name: /obtenerProductosPorId
url: "{{productionURL}}/v1/productos/{{idProducto}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token2}}"
scripts:
  - type: afterResponse
    code: |-
      
      const json = pm.response.json();

      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Obtiene producto por id", function () {
          pm.expect(json).to.have.property("message");
          pm.expect(json.message).to.include("obtenido con exito");
    language: text/javascript
order: 3000
