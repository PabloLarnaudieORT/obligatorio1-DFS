$kind: http-request
name: /actualizarDesafioPorId
url: "{{productionURL}}/v1/desafios/{{idDesafio}}"
method: PATCH
body:
  type: json
  content: "{\r

    \    \"fechaCreacion\" : \"2024-06-06\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{token2}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      const j = pm.response.json();
      const doc = j._doc || j;

      pm.test("Se actualizó", function () {
          pm.expect(doc).to.have.property("_id");
      });

      // SAD sin token
      pm.test("SAD: sin auth → 401", function (done) {
          pm.sendRequest({
              url: pm.environment.get("productionURL") + "/v1/desafios/" + pm.collectionVariables.get("idDesafio"),
              method: "PATCH"
          }, (err, res) => {
              pm.expect(res.code).to.equal(401);
              done();
          });
      });
    language: text/javascript
order: 4000
