$kind: http-request
name: /register
url: "{{productionURL}}/v1/auth/register"
method: POST
body:
  type: json
  content: "{\r

    \  \"username\": \"{{randomUsername1}}\",\r

    \  \"password\": \"123456789\",\r

    \  \"confirmPassword\": \"123456789\",\r

    \  \"rol\": \"user\",\r

    \  \"edad\": 30,\r

    \  \"altura\": 173,\r

    \  \"peso\": 72\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      // Guardar id del usuario creado
      const jsonData = pm.response.json();
      if (jsonData && jsonData.id) {
          pm.collectionVariables.set("idUsuario1", jsonData.id);
      }


      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("La respuesta es JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("Registro de usuario exitoso", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message", "Registro de usuario exitoso");
      });

      pm.test("Register no debe devolver token", function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property("token");
      });
    language: text/javascript
  - type: beforeRequest
    code: |-
      const randomUsername1 = "user_" + Math.random().toString(36).substring(2, 8);
      pm.collectionVariables.set("randomUsername1", randomUsername1);
    language: text/javascript
order: 1000
