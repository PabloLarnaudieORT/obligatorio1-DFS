$kind: http-request
name: /obtenerEjercicioPorId
url: "{{productionURL}}/v1/ejercicios/{{idEjercicio}}"
method: GET
headers:
  Content-Type: application/json
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{token1}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      const json = pm.response.json();
      const ejercicio = json.ejercicio || json._doc || json;

      pm.test("Tiene estructura correcta", function () {
          pm.expect(ejercicio).to.have.property("_id");
          pm.expect(ejercicio).to.have.property("nombreEjercicio");
          pm.expect(ejercicio).to.have.property("tipoDePeso");
      });

      pm.test("Tipos correctos", function () {
          pm.expect(ejercicio.nombreEjercicio).to.be.a("string");
          pm.expect(ejercicio.series).to.be.a("number");
      });

      // SAD id inválido
      pm.test("SAD: id inválido → 400 o 404", function (done) {
          pm.sendRequest({
              url: pm.environment.get("productionURL") + "/v1/ejercicios/000000000000000000000000",
              method: "GET",
              header: {
                  Authorization: "Bearer " + pm.collectionVariables.get("token1")
              }
          }, (err, res) => {
              pm.expect([400, 404]).to.include(res.code);
              done();
          });
      });
    language: text/javascript
order: 3000
