$kind: http-request
name: /obtenerEjercicios
url: "{{productionURL}}/v1/ejercicios"
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{token1}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response es JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();

      pm.test("Tiene estructura correcta", function () {
          pm.expect(json).to.have.property("ejercicios");
      });

      // soporta paginación
      const data = Array.isArray(json.ejercicios)
          ? json.ejercicios
          : json.ejercicios.ejercicios;

      pm.test("Es array de ejercicios", function () {
          pm.expect(data).to.be.an("array");
      });

      pm.test("Campos mínimos", function () {
          if (data.length > 0) {
              pm.expect(data[0]).to.have.property("_id");
              pm.expect(data[0]).to.have.property("nombreEjercicio");
          }
      });

      // SAD sin token
      pm.test("SAD: sin auth → 401", function (done) {
          pm.sendRequest({
              url: pm.environment.get("productionURL") + "/v1/ejercicios",
              method: "GET"
          }, (err, res) => {
              pm.expect(res.code).to.equal(401);
              done();
          });
      });
    language: text/javascript
order: 2000
