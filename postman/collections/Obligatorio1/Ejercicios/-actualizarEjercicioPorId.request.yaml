$kind: http-request
name: /actualizarEjercicioPorId
url: "{{productionURL}}/v1/ejercicios/{{idEjercicio}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: "{\r

    \   \"nombreEjercicio\": \"{{randomInt}} Nuevo ejercicio!\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{token1}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      const json = pm.response.json();
      const ejercicio = json._doc || json.ejercicio || json;

      pm.test("Se actualizó correctamente", function () {
          pm.expect(ejercicio).to.have.property("_id");
      });

      pm.test("Response válida", function () {
          pm.expect(json).to.be.an("object");
      });

      // SAD sin token
      pm.test("SAD: sin auth → 401", function (done) {
          pm.sendRequest({
              url: pm.environment.get("productionURL") + "/v1/ejercicios/" + pm.collectionVariables.get("idEjercicio"),
              method: "PATCH"
          }, (err, res) => {
              pm.expect(res.code).to.equal(401);
              done();
          });
      });
    language: text/javascript
order: 4000
