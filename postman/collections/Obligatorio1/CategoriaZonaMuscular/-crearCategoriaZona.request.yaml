$kind: http-request
name: /crearCategoriaZona
url: "{{productionURL}}/v1/categoriasZonaMuscular"
method: POST
body:
  type: json
  content: |-
    
    {
      "nombreCategoriaZona": "{{nombreCategoriaZona}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{token1}}"
scripts:
  - type: beforeRequest
    code: |-
      const today = new Date().toISOString().split("T")[0];
      pm.environment.set("hoy", today);

      pm.collectionVariables.set(
        "nombreCategoriaZona",
        "ZonaTest" + Math.floor(Math.random() * 100000)
      );
    language: text/javascript
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status code es 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Categoría creada correctamente\", function () {\r

      \    pm.expect(json).to.have.property(\"message\");\r

      \    pm.expect(json.message).to.include(\"agregada exitosamente\");\r

      });"
    language: text/javascript
order: 1000
