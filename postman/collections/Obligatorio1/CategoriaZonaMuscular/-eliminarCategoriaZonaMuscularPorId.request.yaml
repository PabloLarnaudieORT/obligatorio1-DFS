$kind: http-request
name: /eliminarCategoriaZonaMuscularPorId
url: "{{productionURL}}/v1/categoriasZonaMuscular/{{idCategoriaZona}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{token1}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("La respuesta es JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("Elimina categoría de zona muscular", function () {
          const json = pm.response.json();
          const idCategoriaZona = pm.collectionVariables.get("idCategoriaZona");

          pm.expect(json).to.have.property("message");
          pm.expect(json.message).to.include("Categoría de zona muscular");
          pm.expect(json.message).to.include("eliminada exitosamente");

          pm.expect(json).to.have.property("_doc");
          pm.expect(json._doc).to.have.property("_id", idCategoriaZona);
      });
    language: text/javascript
order: 5000
